name: riceproject1
description: AI-Based Rice Pest Infestation Detection App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  crypto: ^3.0.3
  flutter:
    sdk: flutter

  # HTTP & networking
  http: ^1.2.2
  dio: ^5.4.3+1

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # State management
  provider: ^6.1.2

  # UI & Charting
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  lottie: ^3.1.0
  shimmer: ^3.0.0

  # Storage
  shared_preferences: ^2.5.5

  # Utils
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png
    - assets/images/app_logo_full.png
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700